[workspace]
members = [
  "crates/cleanerx-core",
  "crates/adapter-codex",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["BeaCOx"]
rust-version = "1.88"

[workspace.dependencies]
age = "0.12.1"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
flate2 = "1.1"
futures = "0.3"
hex = "0.4"
keyring = "4.1.6"
parking_lot = "0.12"
regex = "1.11"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
walkdir = "2.5"
zstd = "0.13"
