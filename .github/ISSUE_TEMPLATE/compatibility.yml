name: Compatibility report
description: Report sanitized Agent, transport, schema, or platform compatibility behavior.
title: "compat: "
body:
  - type: markdown
    attributes:
      value: |
        Provide metadata only. Never attach transcripts, credentials, memory contents, logs, operation journals, `.cxb` archives, databases, or screenshots containing private data.
  - type: input
    id: cleanerx_version
    attributes:
      label: CleanerX version or commit
      placeholder: v0.1.0-beta.1 or 294b4e4
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - macOS 13 or later
        - x86_64 Linux
        - x86_64 Windows 10/11
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Sanitized OS version
      placeholder: macOS 15.x, Ubuntu 22.04, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - Claude Code
        - OpenCode
        - pi
    validations:
      required: true
  - type: input
    id: agent_version
    attributes:
      label: Agent version
      placeholder: Version string only; do not include installation paths or account data.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Observed transport or mutation route
      options:
        - Codex control socket
        - Codex stdio App Server
        - OpenCode CLI
        - OpenCode verified loopback Server API
        - Guarded direct-file route
        - Read-only filesystem inventory
        - Unknown or unavailable
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Sanitized capability and schema metadata
      description: Include method availability, read-only reasons, and recognized/unknown schema status only.
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Compatibility result
      description: Explain what worked, degraded to read-only, or was blocked.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I included metadata only and removed private paths, IDs, content, credentials, logs, journals, databases, and backups.
          required: true
