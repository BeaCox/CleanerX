name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Require a SemVer tag from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a SemVer tag such as v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi
      - name: Require synchronized application versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/cargo-metadata.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { toMsiVersion } from "./scripts/generate-windows-release-config.mjs";

          const expected = process.env.RELEASE_TAG.slice(1);
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoMetadata = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/cargo-metadata.json`, "utf8"),
          );
          const versions = new Map([
            ["package.json", packageJson.version],
            ["src-tauri/tauri.conf.json", tauriConfig.version],
            ...cargoMetadata.packages.map((pkg) => [`Cargo package ${pkg.name}`, pkg.version]),
          ]);
          const mismatches = [...versions].filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match every version surface:`);
            for (const [source, version] of mismatches) {
              console.error(`- ${source}: ${version}`);
            }
            process.exit(1);
          }
          toMsiVersion(expected);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${expected}\n`);
          NODE

  ci:
    name: Product CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            target: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            target: ""
          - name: Windows x86_64
            os: windows-2025
            platform: windows
            arch: x64
            target: ""
          - name: Windows arm64
            os: windows-11-vs2026-arm
            platform: windows
            arch: arm64
            target: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xvfb
      - name: Install GNU Make on Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: choco install make --no-progress -y
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.target == ''
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.target != ''
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.platform }}-${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for tagged releases." >&2
            exit 1
          fi
      - name: Build macOS bundles
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: make bundles TARGET=${{ matrix.target }} CONFIG=src-tauri/tauri.updater.conf.json
      - name: Verify macOS DMG layout
        if: matrix.platform == 'macos'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_paths=(target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS DMG for layout verification." >&2
            exit 1
          fi
          ./scripts/verify-macos-dmg.sh "${dmg_paths[0]}"
      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: make linux CONFIG=src-tauri/tauri.updater.conf.json
      - name: Smoke-test Linux application
        if: matrix.platform == 'linux'
        run: make smoke-linux
      - name: Inspect Linux bundles
        if: matrix.platform == 'linux'
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          file target/release/bundle/appimage/*.AppImage
      - name: Build Windows bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/generate-windows-release-config.mjs src-tauri/tauri.updater.conf.json "$env:RELEASE_VERSION" target/tauri.windows.release.conf.json
          make windows CONFIG=target/tauri.windows.release.conf.json
      - name: Smoke-test Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Profile release
      - name: Inspect Windows bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi | Format-List Name, Length
          Get-ChildItem target/release/bundle/nsis/*-setup.exe | Format-List Name, Length
      - name: Stage macOS release assets
        if: matrix.platform == 'macos'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir release-assets
          shopt -s nullglob
          app_paths=(target/"$RELEASE_TARGET"/release/bundle/macos/*.app)
          dmg_paths=(target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg)
          updater_paths=(target/"$RELEASE_TARGET"/release/bundle/macos/*.app.tar.gz)
          updater_signature_paths=(target/"$RELEASE_TARGET"/release/bundle/macos/*.app.tar.gz.sig)
          if [[ ${#app_paths[@]} -ne 1 || ${#dmg_paths[@]} -ne 1 || ${#updater_paths[@]} -ne 1 || ${#updater_signature_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one macOS app, DMG, updater archive, and updater signature." >&2
            exit 1
          fi
          asset_base="CleanerX-${RELEASE_VERSION}-macos-${RELEASE_ARCH}"
          ditto -c -k --keepParent "${app_paths[0]}" \
            "release-assets/${asset_base}.zip"
          cp "${dmg_paths[0]}" \
            "release-assets/${asset_base}.dmg"
          cp "${updater_paths[0]}" \
            "release-assets/${asset_base}.tar.gz"
          cp "${updater_signature_paths[0]}" \
            "release-assets/${asset_base}.tar.gz.sig"
      - name: Stage Linux release assets
        if: matrix.platform == 'linux'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir release-assets
          shopt -s nullglob
          deb_paths=(target/release/bundle/deb/*.deb)
          appimage_paths=(target/release/bundle/appimage/*.AppImage)
          appimage_signature_paths=(target/release/bundle/appimage/*.AppImage.sig)
          if [[ ${#deb_paths[@]} -ne 1 || ${#appimage_paths[@]} -ne 1 || ${#appimage_signature_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one deb, AppImage, and AppImage updater signature." >&2
            exit 1
          fi
          asset_base="CleanerX-${RELEASE_VERSION}-linux-${RELEASE_ARCH}"
          cp "${deb_paths[0]}" \
            "release-assets/${asset_base}.deb"
          cp "${appimage_paths[0]}" \
            "release-assets/${asset_base}.AppImage"
          cp "${appimage_signature_paths[0]}" \
            "release-assets/${asset_base}.AppImage.sig"
      - name: Stage Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $msi = @(Get-ChildItem target/release/bundle/msi/*.msi)
          $nsis = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          $nsisSignature = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe.sig)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1 -or $nsisSignature.Count -ne 1) {
            throw "Expected exactly one MSI, NSIS installer, and NSIS updater signature."
          }
          $assetBase = "CleanerX-$($env:RELEASE_VERSION)-windows-$($env:RELEASE_ARCH)"
          Copy-Item $msi[0].FullName "release-assets/$assetBase.msi"
          Copy-Item $nsis[0].FullName "release-assets/$assetBase.exe"
          Copy-Item $nsisSignature[0].FullName "release-assets/$assetBase.exe.sig"
      - name: Record build metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "version=$RELEASE_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "platform=$RELEASE_PLATFORM"
            echo "architecture=$RELEASE_ARCH"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } > "release-assets/CleanerX-${RELEASE_VERSION}-${RELEASE_PLATFORM}-${RELEASE_ARCH}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate signed update manifest
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/generate-update-manifest.mjs release-assets "$RELEASE_VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Add source lockfiles, release metadata, and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tar -czf "release-assets/CleanerX-${RELEASE_VERSION}-lockfiles.tar.gz" \
            Cargo.lock pnpm-lock.yaml
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "version=$RELEASE_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
            echo "workflow=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "release-assets/CleanerX-${RELEASE_VERSION}-release.txt"
          checksum_file="CleanerX-${RELEASE_VERSION}-checksums.txt"
          rm -f "release-assets/$checksum_file"
          (cd release-assets && sha256sum * > "$checksum_file")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WARNING: |
            > [!WARNING]
            > These CleanerX builds remain unsigned at the operating-system level and are not notarized. In-app updater packages carry a separate Tauri signature that an installed CleanerX build verifies before replacement; this does not establish an Apple or Microsoft publisher identity. Verify manually downloaded artifacts with the published SHA-256 checksums. CleanerX permanently deletes private local Agent data when cleanup runs without a backup, so review every cleanup plan and the documented compatibility limits first.
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --draft \
            --title "CleanerX $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$RELEASE_WARNING" \
            "${release_flags[@]}"
