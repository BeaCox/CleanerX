name: Linux unsigned bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: linux-bundles-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri and smoke-test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-bundles-release-v1
      - run: pnpm install --frozen-lockfile
      - run: make linux
      - run: make smoke-linux
      - name: Inspect Linux packages
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          file target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: CleanerX-linux-x86_64-unsigned
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
