name: Windows unsigned bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/windows-bundles.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/smoke-windows.ps1"
      - "src-tauri/tauri.windows.conf.json"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-bundles-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundles:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-bundles-release-v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:windows
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1 -Profile release
      - name: Inspect Windows installers
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi | Format-List Name, Length
          Get-ChildItem target/release/bundle/nsis/*-setup.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: CleanerX-windows-x86_64-unsigned
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
