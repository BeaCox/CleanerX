name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    # This name is a required status check on main. Keep it stable.
    name: Quality and Linux smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dbus-x11 \
            gnome-keyring \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-linux-x64
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete quality gate
        run: make check

      - name: Verify Linux Secret Service backup and restore
        run: |
          mkdir -p \
            "$RUNNER_TEMP/cleanerx-keyring/data" \
            "$RUNNER_TEMP/cleanerx-keyring/config" \
            "$RUNNER_TEMP/cleanerx-keyring/runtime"
          chmod 700 "$RUNNER_TEMP/cleanerx-keyring/runtime"
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$1/data"
            export XDG_CONFIG_HOME="$1/config"
            export XDG_RUNTIME_DIR="$1/runtime"
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            CLEANERX_LINUX_SECRET_SERVICE_TEST=1 \
              cargo test --workspace --locked live_linux_secret_service_backup_round_trip -- --ignored
          ' _ "$RUNNER_TEMP/cleanerx-keyring"

      - name: Build Linux debug application
        run: cargo build --locked -p cleanerx-app

      - name: Smoke-test Linux application
        run: make smoke-linux LINUX_PROFILE=debug

  platform:
    # The macOS and Windows x64 names are required status checks on main.
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            platform: macos
            credential_test: false
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            platform: linux
            credential_test: false
          - name: Windows
            runner: windows-2025
            platform: windows
            credential_test: true
          - name: Windows ARM64
            runner: windows-11-vs2026-arm
            platform: windows
            credential_test: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux application dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm build

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Verify Windows Credential Manager backup and restore
        if: matrix.credential_test
        env:
          CLEANERX_WINDOWS_CREDENTIAL_MANAGER_TEST: "1"
        run: cargo test --workspace --locked live_windows_credential_manager_backup_round_trip -- --ignored

      - name: Build desktop application
        run: cargo build --locked -p cleanerx-app

      - name: Smoke-test Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Profile debug

      - name: Smoke-test Linux application
        if: matrix.platform == 'linux'
        run: make smoke-linux LINUX_PROFILE=debug
