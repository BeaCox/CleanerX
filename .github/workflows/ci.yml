name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and Linux smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
      - run: make setup
      - run: make check
      - name: Build Linux debug application
        run: cargo build -p cleanerx-app
      - name: Smoke-test Linux application
        run: make smoke-linux LINUX_PROFILE=debug

  platform:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            platform: macos
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            platform: linux
          - name: Windows
            runner: windows-2025
            platform: windows
          - name: Windows ARM64
            runner: windows-11-vs2026-arm
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux application dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm build
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Build desktop application
        run: cargo build -p cleanerx-app
      - name: Smoke-test Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Profile debug
      - name: Smoke-test Linux application
        if: matrix.platform == 'linux'
        run: make smoke-linux LINUX_PROFILE=debug
